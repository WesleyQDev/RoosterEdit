<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="title">
  <title id="title">RoosterEdit</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2027" />
      <stop offset="0.55" stop-color="#08121b" />
      <stop offset="1" stop-color="#04080d" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.05" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d6e8ee" />
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="280" rx="26" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="280" rx="26" fill="url(#glow)" />
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="25.25" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.5" />

  <!-- wordmark -->
  <text x="600" y="162" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2.5" fill="url(#wordmark)">RoosterEdit</text>

  <!-- timeline motif -->
  <g>
    <rect x="383" y="196" width="64" height="10" rx="5" fill="#22d3ee" />
    <rect x="455" y="196" width="40" height="10" rx="5" fill="#273945" />
    <rect x="503" y="196" width="96" height="10" rx="5" fill="#22d3ee" />
    <rect x="607" y="196" width="28" height="10" rx="5" fill="#273945" />
    <rect x="643" y="196" width="72" height="10" rx="5" fill="#8fb9c6" />
    <rect x="723" y="196" width="52" height="10" rx="5" fill="#273945" />
    <rect x="783" y="196" width="34" height="10" rx="5" fill="#22d3ee" />
    <!-- playhead -->
    <rect x="651" y="184" width="2" height="34" rx="1" fill="#ffffff" fill-opacity="0.55" />
  </g>
</svg>
